[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volta"
version = "0.1.0"
description = "An agent that trades a grid battery on the day-ahead electricity market."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "entsoe-py>=0.6.0",
    "pulp>=2.8.0",
    "mlflow>=2.12.0",
    "openai>=1.30.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
volta = "volta.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
